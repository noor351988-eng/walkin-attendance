<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>تسجيل الحضور الوجاهي</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" />
<style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="min-h-screen bg-stone-100" dir="rtl">
<div id="root"></div>

<script type="text/babel" data-presets="react">
/* ============================================================================
   نسخة موحّدة: رابط واحد لكل الجامعات والشعب — الاختيار من قائمة منسدلة
   بدل رابط مخصّص لكل قاعة. شغّل walkin_patch.sql أولًا قبل استخدام هذا الملف.
============================================================================ */

const SUPABASE_URL = "https://szlvqiuxnuoreoukkrzb.supabase.co";
const SUPABASE_KEY = "sb_publishable_las_Qg3ApOgeY5vsgthyJg_eLTrqSws";

async function rpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
    body: JSON.stringify(args),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function useRosterIndex() {
  const [index, setIndex] = React.useState([]);
  React.useEffect(() => {
    rpc("walkin_roster_index", {}).then(setIndex).catch(() => setIndex([]));
  }, []);
  return index;
}

function UniSectionPicker({ university, section, setUniversity, setSection, index }) {
  const universities = [...new Set(index.map((r) => r.university))].sort();
  const sections = university ? [...new Set(index.filter((r) => r.university === university).map((r) => r.section))].sort() : [];
  return (
    <div className="mb-4 rounded-xl border border-stone-200 bg-white p-4 shadow-sm">
      <label className="mb-1 block text-sm font-semibold text-stone-700">الجامعة</label>
      <select value={university} onChange={(e) => { setUniversity(e.target.value); setSection(""); }}
        className="mb-3 w-full rounded-lg border border-stone-300 bg-white px-3 py-2.5 text-base focus:border-amber-600 focus:outline-none">
        <option value="">— اختر الجامعة —</option>
        {universities.map((u) => <option key={u} value={u}>{u}</option>)}
        <option value="__new__">+ جامعة جديدة غير موجودة بالقائمة</option>
      </select>
      {university === "__new__" && (
        <input placeholder="اكتب اسم الجامعة الجديدة" onChange={(e) => setUniversity(e.target.value)}
          className="mb-3 w-full rounded-lg border border-amber-400 px-3 py-2.5 text-base focus:outline-none" />
      )}

      <label className="mb-1 block text-sm font-semibold text-stone-700">الشعبة</label>
      {sections.length > 0 ? (
        <select value={section} onChange={(e) => setSection(e.target.value)}
          className="w-full rounded-lg border border-stone-300 bg-white px-3 py-2.5 text-base focus:border-amber-600 focus:outline-none">
          <option value="">— اختر الشعبة —</option>
          {sections.map((s) => <option key={s} value={s}>{s}</option>)}
          <option value="__new__">+ شعبة جديدة غير موجودة بالقائمة</option>
        </select>
      ) : (
        <input placeholder="اكتب اسم الشعبة" value={section} onChange={(e) => setSection(e.target.value)}
          className="w-full rounded-lg border border-stone-300 px-3 py-2.5 text-base focus:border-amber-600 focus:outline-none" />
      )}
      {section === "__new__" && (
        <input placeholder="اكتب اسم الشعبة الجديدة" onChange={(e) => setSection(e.target.value)}
          className="mt-2 w-full rounded-lg border border-amber-400 px-3 py-2.5 text-base focus:outline-none" />
      )}
    </div>
  );
}

function CheckInView() {
  const index = useRosterIndex();
  const [university, setUniversity] = React.useState("");
  const [section, setSection] = React.useState("");
  const [studentId, setStudentId] = React.useState(localStorage.getItem("walkin_id") || "");
  const [studentName, setStudentName] = React.useState(localStorage.getItem("walkin_name") || "");
  const [code, setCode] = React.useState("");
  const [status, setStatus] = React.useState(null);

  const ready = university && university !== "__new__" && section && section !== "__new__";

  const submit = async () => {
    if (!ready || !studentId.trim() || !studentName.trim() || !code.trim()) return;
    setStatus("sending");
    localStorage.setItem("walkin_id", studentId.trim());
    localStorage.setItem("walkin_name", studentName.trim());
    try {
      const result = await rpc("walkin_check_in", {
        p_university: university, p_section: section,
        p_code: code.trim(), p_student_id: studentId.trim(), p_student_name: studentName.trim(),
      });
      setStatus(result === "ok" ? "ok" : result);
    } catch (e) { setStatus("error"); }
  };

  return (
    <div className="mx-auto max-w-md px-5 py-8">
      <UniSectionPicker university={university} section={section} setUniversity={setUniversity} setSection={setSection} index={index} />

      {status === "ok" ? (
        <div className="rounded-xl border border-teal-200 bg-teal-50 p-6 text-center">
          <div className="text-3xl">✅</div>
          <div className="mt-2 font-bold text-teal-800">تم تسجيل حضورك بنجاح</div>
        </div>
      ) : (
        <div className={`rounded-xl border border-stone-200 bg-white p-5 shadow-sm ${ready ? "" : "opacity-50 pointer-events-none"}`}>
          <label className="mb-1 block text-sm font-semibold text-stone-700">الاسم الكامل</label>
          <input value={studentName} onChange={(e) => setStudentName(e.target.value)}
            className="mb-3 w-full rounded-lg border border-stone-300 px-3 py-2.5 text-base focus:border-amber-600 focus:outline-none" />
          <label className="mb-1 block text-sm font-semibold text-stone-700">الرقم الجامعي</label>
          <input value={studentId} onChange={(e) => setStudentId(e.target.value)}
            className="mb-3 w-full rounded-lg border border-stone-300 px-3 py-2.5 text-base focus:border-amber-600 focus:outline-none" />
          <label className="mb-1 block text-sm font-semibold text-stone-700">الكود المُعلن بالقاعة الآن</label>
          <input value={code} onChange={(e) => setCode(e.target.value)} inputMode="numeric" placeholder="مثال: 4471"
            className="mb-4 w-full rounded-lg border border-stone-300 px-3 py-2.5 text-center text-2xl font-bold tracking-widest focus:border-amber-600 focus:outline-none" />
          {status === "invalid_or_expired" && (
            <div className="mb-3 rounded-lg bg-rose-50 p-2 text-center text-sm font-semibold text-rose-700">الكود غير صحيح أو انتهت صلاحيته</div>
          )}
          {status === "error" && (
            <div className="mb-3 rounded-lg bg-rose-50 p-2 text-center text-sm font-semibold text-rose-700">تعذّر الإرسال، حاول مرة أخرى</div>
          )}
          <button onClick={submit} disabled={status === "sending"}
            className="w-full rounded-lg bg-amber-700 px-4 py-3 text-sm font-bold text-white hover:bg-amber-800 disabled:opacity-50">
            {status === "sending" ? "جارٍ الإرسال…" : "تسجيل حضوري"}
          </button>
        </div>
      )}
      {!ready && <p className="mt-2 text-center text-xs text-stone-400">اختر الجامعة والشعبة أولًا</p>}
    </div>
  );
}

function RosterUploader({ university, section, onUploaded }) {
  const [busy, setBusy] = React.useState(false);
  const [msg, setMsg] = React.useState("");

  const handleFile = async (file) => {
    setBusy(true); setMsg("");
    try {
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
      let start = 0;
      const header = (rows[0] || []).map((c) => String(c || "").trim());
      let nameCol = 0, idCol = 1;
      if (header.some((h) => h.includes("اسم") || h.includes("رقم"))) {
        start = 1;
        nameCol = header.findIndex((h) => h.includes("اسم"));
        idCol = header.findIndex((h) => h.includes("رقم"));
        if (nameCol === -1) nameCol = 0;
        if (idCol === -1) idCol = 1;
      }
      const roster = rows.slice(start)
        .filter((r) => r && r[nameCol] && r[idCol])
        .map((r) => ({ name: String(r[nameCol]).trim(), id: String(r[idCol]).trim() }));
      const count = await rpc("walkin_upload_roster", { p_university: university, p_section: section, p_rows: roster });
      setMsg(`تم رفع ${count} طالب بنجاح`);
      onUploaded();
    } catch (e) {
      setMsg("تعذّر رفع الملف — تفاصيل الخطأ: " + (e && e.message ? e.message.slice(0, 300) : String(e)));
    } finally { setBusy(false); }
  };

  return (
    <div className="mb-4 rounded-xl border border-stone-200 bg-white p-4 shadow-sm">
      <div className="mb-2 text-sm font-semibold text-stone-700">رفع/استبدال روستر الشعبة (ملف Excel: اسم + رقم جامعي)</div>
      <input type="file" accept=".xlsx,.xls" onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])}
        className="mb-2 w-full text-sm" disabled={busy} />
      {msg && <div className="text-xs font-semibold text-teal-700">{msg}</div>}
    </div>
  );
}

function MonitorView() {
  const index = useRosterIndex();
  const [university, setUniversity] = React.useState("");
  const [section, setSection] = React.useState("");
  const [session, setSession] = React.useState(null);
  const [minutes, setMinutes] = React.useState(15);
  const [starting, setStarting] = React.useState(false);
  const [exporting, setExporting] = React.useState(false);
  const [rosterCount, setRosterCount] = React.useState(null);

  const ready = university && university !== "__new__" && section && section !== "__new__";

  const refreshSession = React.useCallback(async () => {
    if (!ready) return;
    try {
      const rows = await rpc("walkin_session_status", { p_university: university, p_section: section });
      setSession(rows && rows.length ? rows[0] : null);
    } catch (e) {}
  }, [university, section, ready]);

  const refreshRoster = React.useCallback(async () => {
    if (!ready) return;
    try {
      const rows = await rpc("walkin_get_roster", { p_university: university, p_section: section });
      setRosterCount(rows.length);
    } catch (e) {}
  }, [university, section, ready]);

  React.useEffect(() => {
    if (!ready) return;
    refreshSession(); refreshRoster();
    const t = setInterval(refreshSession, 10000);
    return () => clearInterval(t);
  }, [refreshSession, refreshRoster, ready]);

  const start = async () => {
    setStarting(true);
    try { await rpc("walkin_start_session", { p_university: university, p_section: section, p_minutes: Number(minutes) }); await refreshSession(); }
    finally { setStarting(false); }
  };

  const exportMatrix = async () => {
    setExporting(true);
    try {
      const rows = await rpc("walkin_matrix_data", { p_university: university, p_section: section });
      if (!rows.length) { alert("لا توجد بيانات — تأكد من رفع الروستر ووجود محاضرات مسجَّلة"); return; }
      const dates = [...new Set(rows.map((r) => r.session_date))].sort();
      const byStudent = new Map();
      for (const r of rows) {
        if (!byStudent.has(r.student_id)) byStudent.set(r.student_id, { name: r.student_name, id: r.student_id, marks: {} });
        byStudent.get(r.student_id).marks[r.session_date] = r.present ? 1 : 0;
      }
      const data = [...byStudent.values()].map((s) => {
        const row = { "اسم الطالب": s.name, "الرقم الجامعي": s.id, "تاريخ التسجيل": "", "الأعذار": "", ملاحظات: "" };
        let present = 0, absent = 0;
        for (const d of dates) {
          const v = s.marks[d] ?? 0;
          row[d] = v;
          if (v === 1) present++; else absent++;
        }
        row["الحضور"] = present; row["الغياب"] = absent;
        return row;
      });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), section.slice(0, 28) || "الشعبة");
      XLSX.writeFile(wb, `${university}_${section}.xlsx`);
    } finally { setExporting(false); }
  };

  return (
    <div className="mx-auto max-w-lg space-y-4 px-5 py-8">
      <UniSectionPicker university={university} section={section} setUniversity={setUniversity} setSection={setSection} index={index} />

      {ready && (
        <>
          {rosterCount !== null && (
            <div className="text-center text-xs text-stone-400">الروستر المسجَّل حاليًا: {rosterCount} طالب</div>
          )}

          <RosterUploader university={university} section={section} onUploaded={refreshRoster} />

          {session ? (
            <div className="rounded-xl border border-teal-200 bg-teal-50 p-6 text-center">
              <div className="text-xs font-semibold text-teal-700">الكود الحالي — أعلنه بصوتك أو اعرضه للطلاب</div>
              <div className="my-2 text-6xl font-extrabold tracking-widest text-teal-800">{session.code}</div>
              <div className="text-xs text-teal-700">ينتهي: {new Date(session.expires_at).toLocaleTimeString("ar-JO")}</div>
              <div className="mt-3 text-sm font-bold text-teal-800">عدد المسجَّلين حتى الآن: {session.checkin_count}</div>
            </div>
          ) : (
            <div className="rounded-xl border border-stone-200 bg-stone-50 p-4 text-center text-sm text-stone-500">لا توجد جلسة نشطة حاليًا</div>
          )}

          <div className="rounded-xl border border-stone-200 bg-white p-4 shadow-sm">
            <label className="mb-1 block text-sm font-semibold text-stone-700">مدة صلاحية الكود (دقائق)</label>
            <input type="number" min="1" value={minutes} onChange={(e) => setMinutes(e.target.value)}
              className="mb-3 w-full rounded-lg border border-stone-300 px-3 py-2 text-center focus:border-amber-600 focus:outline-none" />
            <button onClick={start} disabled={starting}
              className="w-full rounded-lg bg-amber-700 px-4 py-2.5 text-sm font-bold text-white hover:bg-amber-800 disabled:opacity-50">
              {starting ? "جارٍ البدء…" : "توليد كود جديد (بدء محاضرة اليوم)"}
            </button>
          </div>

          <button onClick={exportMatrix} disabled={exporting}
            className="w-full rounded-lg bg-stone-800 px-4 py-2.5 text-sm font-bold text-white hover:bg-stone-900 disabled:opacity-50">
            {exporting ? "جارٍ التصدير…" : "تصدير كشف الحضور (بصيغة الجامعات المستثناة)"}
          </button>
        </>
      )}
    </div>
  );
}

function App() {
  const role = new URLSearchParams(location.search).get("role") || "student";
  return (
    <div className="min-h-screen">
      <header className="border-b-4 border-amber-700 bg-stone-900 py-4 text-center text-stone-100">
        <h1 className="text-base font-extrabold">تسجيل الحضور الوجاهي</h1>
      </header>
      {role === "monitor" ? <MonitorView /> : <CheckInView />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
